<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neuro-Tracking — knowledge graph</title>
    <style>
      :root {
        --light: #faf8f8;
        --lightgray: #e5e5e5;
        --gray: #b8b8b8;
        --darkgray: #4e4e4e;
        --dark: #2b2b2b;
        --secondary: #284b63;
        --tertiary: #84a59d;
        --panel: rgba(255, 255, 255, 0.82);
        --font: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --light: #161618;
          --lightgray: #393639;
          --gray: #646464;
          --darkgray: #d4d4d4;
          --dark: #ebebec;
          --secondary: #7b97aa;
          --panel: rgba(30, 30, 33, 0.86);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font);
        background: var(--light);
        color: var(--dark);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px 10px;
        border-bottom: 1px solid var(--lightgray);
        font-size: 13px;
      }
      #bar input[type="search"] {
        font: inherit;
        padding: 5px 9px;
        border: 1px solid var(--lightgray);
        border-radius: 6px;
        background: var(--light);
        color: var(--dark);
        min-width: 190px;
        flex: 1 1 190px;
      }
      #bar select, #bar button {
        font: inherit;
        padding: 5px 9px;
        border: 1px solid var(--lightgray);
        border-radius: 6px;
        background: var(--light);
        color: var(--dark);
        cursor: pointer;
      }
      #bar button:hover, #bar select:hover { border-color: var(--secondary); }
      .chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 10px; border-bottom: 1px solid var(--lightgray); }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--lightgray);
        background: transparent;
        color: var(--dark);
        cursor: pointer;
        user-select: none;
      }
      .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
      .chip.off { opacity: 0.35; text-decoration: line-through; }
      .chip .n { color: var(--gray); font-variant-numeric: tabular-nums; }
      #stage { flex: 1; position: relative; min-height: 0; }
      #cy { position: absolute; inset: 0; }
      #panel {
        position: absolute;
        top: 10px;
        right: 10px;
        width: min(340px, 62%);
        max-height: calc(100% - 20px);
        overflow-y: auto;
        background: var(--panel);
        backdrop-filter: blur(8px);
        border: 1px solid var(--lightgray);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.45;
        display: none;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      }
      #panel.on { display: block; }
      #panel h2 { font-size: 15px; margin: 0 0 2px; line-height: 1.3; }
      #panel .id { font-family: var(--mono); font-size: 11px; color: var(--gray); word-break: break-all; }
      #panel .type { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px; color: #fff; margin: 6px 0; }
      #panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray); margin: 14px 0 4px; }
      #panel ul { margin: 0; padding-left: 0; list-style: none; }
      #panel li { margin-bottom: 7px; }
      #panel .pred { font-family: var(--mono); font-size: 11px; color: var(--secondary); }
      #panel a { color: var(--secondary); }
      #panel .rel { cursor: pointer; text-decoration: underline dotted; }
      blockquote {
        margin: 4px 0 0;
        padding-left: 8px;
        border-left: 2px solid var(--tertiary);
        color: var(--darkgray);
        font-size: 12px;
      }
      blockquote .cite { display: block; color: var(--gray); font-size: 11px; margin-top: 2px; }
      #close { float: right; border: none; background: none; color: var(--gray); cursor: pointer; font-size: 17px; line-height: 1; }
      #hint, #err {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font-size: 11.5px;
        color: var(--gray);
        max-width: 55%;
      }
      #err { color: #b91c1c; bottom: auto; top: 12px; }
    </style>
  </head>
  <body>
    <div id="bar">
      <input id="q" type="search" placeholder="Search nodes…" autocomplete="off" />
      <select id="hop" title="How far to expand around the focused node">
        <option value="0">whole graph</option>
        <option value="1">focus · 1 hop</option>
        <option value="2" selected>focus · 2 hops</option>
        <option value="3">focus · 3 hops</option>
      </select>
      <button id="reset" title="Clear focus and re-run the layout">reset</button>
      <button id="weak" title="Show or hide navigation-only [[wikilink]] edges">wikilinks: off</button>
      <button id="fit">fit</button>
    </div>
    <div class="chips" id="types"></div>
    <div class="chips" id="cats"></div>
    <div id="stage">
      <div id="cy"></div>
      <div id="panel"><button id="close" title="Close">×</button><div id="body"></div></div>
      <div id="hint">Click a node for detail · double-click to focus its neighbourhood</div>
      <div id="err" hidden></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
    <script>
      // Fallback if the primary CDN version ever disappears.
      if (!window.cytoscape) {
        document.write(
          '<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"><\/script>',
        );
      }
    </script>
    <script>
      const SHAPES = {
        "round-rectangle": "round-rectangle",
        "round-tag": "round-tag",
        "concave-hexagon": "concave-hexagon",
        rectangle: "rectangle",
        ellipse: "ellipse",
        diamond: "diamond",
      };
      const fail = (m) => {
        const e = document.getElementById("err");
        e.hidden = false;
        e.textContent = m;
      };

      (async function () {
        if (!window.cytoscape) return fail("Could not load the graph library (CDN blocked?).");
        let data;
        try {
          data = await (await fetch("./graph-data.json", { cache: "no-cache" })).json();
        } catch (e) {
          return fail("Could not load graph-data.json — run `make site` in the graph/ directory.");
        }

        const typeOf = (id) => data.nodes.find((n) => n.id === id)?.type;
        const weakPreds = new Set(
          Object.entries(data.predicates)
            .filter(([, p]) => p.category === "weak")
            .map(([k]) => k),
        );
        const nodeById = new Map(data.nodes.map((n) => [n.id, n]));

        const elements = [
          ...data.nodes.map((n) => ({
            data: {
              id: n.id,
              label: n.label,
              type: n.type,
              color: data.nodeTypes[n.type]?.color || "#888",
              shape: SHAPES[data.nodeTypes[n.type]?.shape] || "ellipse",
              size: 18 + Math.min(26, (n.degree || 0) * 2.2),
            },
          })),
          ...data.edges.map((e, i) => ({
            data: {
              id: "e" + i,
              source: e.source,
              target: e.target,
              predicate: e.predicate,
              category: e.category,
              color: data.predicateCategories[e.category]?.color || "#999",
              weak: weakPreds.has(e.predicate) ? 1 : 0,
              evidence: e.quote ? 1 : 0,
            },
          })),
        ];

        const cy = cytoscape({
          container: document.getElementById("cy"),
          elements,
          wheelSensitivity: 0.25,
          style: [
            {
              selector: "node",
              style: {
                "background-color": "data(color)",
                shape: "data(shape)",
                width: "data(size)",
                height: "data(size)",
                label: "data(label)",
                "font-size": 9,
                "font-family": "Source Sans Pro, sans-serif",
                color: getComputedStyle(document.body).getPropertyValue("--dark"),
                "text-valign": "bottom",
                "text-margin-y": 3,
                "text-wrap": "ellipsis",
                "text-max-width": 110,
                "text-background-color": getComputedStyle(document.body).getPropertyValue("--light"),
                "text-background-opacity": 0.7,
                "text-background-padding": 1.5,
                "border-width": 0,
                "transition-property": "opacity",
                "transition-duration": "140ms",
              },
            },
            {
              selector: "edge",
              style: {
                width: 1.2,
                "line-color": "data(color)",
                "target-arrow-color": "data(color)",
                "target-arrow-shape": "triangle",
                "arrow-scale": 0.6,
                "curve-style": "bezier",
                opacity: 0.55,
              },
            },
            { selector: "edge[evidence = 1]", style: { width: 2.2, opacity: 0.8 } },
            { selector: "edge[weak = 1]", style: { "line-style": "dotted", opacity: 0.3 } },
            {
              selector: "node:selected",
              style: { "border-width": 3, "border-color": getComputedStyle(document.body).getPropertyValue("--secondary") },
            },
            { selector: ".dim", style: { opacity: 0.08, "text-opacity": 0 } },
            { selector: ".hidden", style: { display: "none" } },
            { selector: "edge.hi", style: { width: 3, opacity: 1 } },
            { selector: "node.hi", style: { "border-width": 2, "border-color": "#f59e0b" } },
          ],
          layout: { name: "cose", animate: false, nodeRepulsion: 9000, idealEdgeLength: 90, padding: 30 },
        });

        // ------------------------------------------------------------ legends
        const offTypes = new Set();
        const offCats = new Set();
        let showWeak = false;

        const countBy = (arr, key) =>
          arr.reduce((m, x) => ((m[x[key]] = (m[x[key]] || 0) + 1), m), {});
        const typeCounts = countBy(data.nodes, "type");
        const catCounts = countBy(data.edges, "category");

        function chip(container, label, color, count, isOff, onClick) {
          const b = document.createElement("button");
          b.className = "chip" + (isOff ? " off" : "");
          b.innerHTML =
            '<span class="dot" style="background:' + color + '"></span>' +
            label +
            ' <span class="n">' + count + "</span>";
          b.onclick = () => {
            onClick();
            b.classList.toggle("off");
            apply();
          };
          container.appendChild(b);
        }

        for (const [t, def] of Object.entries(data.nodeTypes)) {
          if (!typeCounts[t]) continue;
          chip(document.getElementById("types"), t, def.color, typeCounts[t], false, () =>
            offTypes.has(t) ? offTypes.delete(t) : offTypes.add(t),
          );
        }
        for (const [c, def] of Object.entries(data.predicateCategories)) {
          if (!catCounts[c] || c === "weak") continue;
          chip(document.getElementById("cats"), c, def.color, catCounts[c], false, () =>
            offCats.has(c) ? offCats.delete(c) : offCats.add(c),
          );
        }

        // ------------------------------------------------------------- filter
        let focusId = null;
        const hopSel = document.getElementById("hop");

        function neighbourhood(id, hop) {
          const seen = new Set([id]);
          let frontier = [id];
          for (let h = 0; h < hop; h++) {
            const next = [];
            for (const n of frontier) {
              cy.getElementById(n)
                .connectedEdges()
                .not(".hidden")
                .forEach((e) => {
                  for (const end of [e.data("source"), e.data("target")]) {
                    if (!seen.has(end)) {
                      seen.add(end);
                      next.push(end);
                    }
                  }
                });
            }
            frontier = next;
          }
          return seen;
        }

        function apply() {
          cy.batch(() => {
            cy.nodes().forEach((n) => n.toggleClass("hidden", offTypes.has(n.data("type"))));
            cy.edges().forEach((e) => {
              const hide =
                (e.data("weak") === 1 && !showWeak) ||
                offCats.has(e.data("category")) ||
                e.source().hasClass("hidden") ||
                e.target().hasClass("hidden");
              e.toggleClass("hidden", hide);
            });
            const hop = Number(hopSel.value);
            if (focusId && hop > 0 && cy.getElementById(focusId).length) {
              const keep = neighbourhood(focusId, hop);
              cy.nodes().forEach((n) => {
                if (!n.hasClass("hidden")) n.toggleClass("dim", !keep.has(n.id()));
              });
              cy.edges().forEach((e) =>
                e.toggleClass("dim", !(keep.has(e.data("source")) && keep.has(e.data("target")))),
              );
            } else {
              cy.elements().removeClass("dim");
            }
          });
        }

        // -------------------------------------------------------------- panel
        const panel = document.getElementById("panel");
        const body = document.getElementById("body");
        document.getElementById("close").onclick = () => panel.classList.remove("on");

        const escape = (s) =>
          String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
        const SKIP = new Set(["id", "type", "label", "title", "href", "degree", "file", "sections"]);

        function relLine(pred, otherId, e, dir) {
          const o = nodeById.get(otherId);
          const arrow = dir === "out" ? "→" : "←";
          let html =
            '<li><span class="pred">' + escape(pred) + " " + arrow + '</span> ' +
            '<span class="rel" data-id="' + escape(otherId) + '">' + escape(o ? o.label : otherId) + "</span>";
          if (e.quote) {
            html +=
              "<blockquote>“" + escape(e.quote) + "”" +
              '<span class="cite">' + escape([e.pageApprox, e.confidence && e.confidence + " confidence"].filter(Boolean).join(" · ")) + "</span></blockquote>";
          }
          return html + "</li>";
        }

        function show(id) {
          const n = nodeById.get(id);
          if (!n) return;
          const def = data.nodeTypes[n.type] || {};
          const out = data.edges.filter((e) => e.source === id && (showWeak || !weakPreds.has(e.predicate)));
          const inc = data.edges.filter((e) => e.target === id && (showWeak || !weakPreds.has(e.predicate)));
          const props = Object.entries(n).filter(([k, v]) => !SKIP.has(k) && k !== "summary" && typeof v !== "object");

          let html = "<h2>" + escape(n.label) + "</h2>";
          html += '<div class="id">' + escape(n.id) + "</div>";
          html += '<span class="type" style="background:' + (def.color || "#888") + '">' + escape(n.type) + "</span>";
          if (n.summary) html += "<div>" + escape(n.summary) + "</div>";
          if (n.href)
            html += '<div style="margin-top:8px"><a href="' + escape(n.href) + '" target="_top">open the note →</a></div>';
          if (props.length) {
            html += "<h3>fields</h3><ul>";
            for (const [k, v] of props) html += "<li><b>" + escape(k) + ":</b> " + escape(v) + "</li>";
            html += "</ul>";
          }
          if (out.length) {
            html += "<h3>outgoing</h3><ul>";
            for (const e of out) html += relLine(e.predicate, e.target, e, "out");
            html += "</ul>";
          }
          if (inc.length) {
            html += "<h3>incoming</h3><ul>";
            for (const e of inc) html += relLine(e.predicate, e.source, e, "in");
            html += "</ul>";
          }
          body.innerHTML = html;
          panel.classList.add("on");
          body.querySelectorAll(".rel").forEach((el) => {
            el.onclick = () => {
              const t = el.dataset.id;
              cy.$(":selected").unselect();
              cy.getElementById(t).select();
              show(t);
              cy.animate({ center: { eles: cy.getElementById(t) } }, { duration: 250 });
            };
          });
        }

        cy.on("tap", "node", (evt) => show(evt.target.id()));
        cy.on("dbltap", "node", (evt) => {
          focusId = evt.target.id();
          apply();
          cy.animate({ fit: { eles: cy.elements().not(".dim").not(".hidden"), padding: 40 } }, { duration: 300 });
        });
        cy.on("tap", (evt) => {
          if (evt.target === cy) panel.classList.remove("on");
        });

        // ------------------------------------------------------------ toolbar
        document.getElementById("q").addEventListener("input", (e) => {
          const q = e.target.value.trim().toLowerCase();
          cy.nodes().removeClass("hi");
          if (!q) return;
          cy.nodes()
            .filter((n) => n.data("label").toLowerCase().includes(q) || n.id().toLowerCase().includes(q))
            .addClass("hi");
        });
        hopSel.onchange = apply;
        document.getElementById("reset").onclick = () => {
          focusId = null;
          apply();
          cy.layout({ name: "cose", animate: false, nodeRepulsion: 9000, idealEdgeLength: 90, padding: 30 }).run();
        };
        document.getElementById("fit").onclick = () => cy.fit(cy.elements().not(".hidden"), 30);
        const weakBtn = document.getElementById("weak");
        weakBtn.onclick = () => {
          showWeak = !showWeak;
          weakBtn.textContent = "wikilinks: " + (showWeak ? "on" : "off");
          apply();
        };

        apply();
        cy.fit(cy.elements().not(".hidden"), 30);

        const m = data.meta;
        document.getElementById("hint").textContent =
          data.nodes.length + " nodes · " + data.edges.length + " edges · ontology v" +
          m.ontologyVersion + " · click a node for detail, double-click to focus";
      })();
    </script>
  </body>
</html>

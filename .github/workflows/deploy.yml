name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  graph:
    name: Knowledge graph — strict build, tests, freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Strict build + regression suite (warnings are fatal)
        run: make check
        working-directory: graph
      - name: Re-export the graph into the site
        run: make site
        working-directory: graph
      - name: Fail if the committed export is stale
        run: |
          git diff --exit-code -- content/graph/graph-data.json content/graph/ontology.md \
            || { echo "::error::content/graph is out of date — run 'make site' in graph/ and commit the result."; exit 1; }

  build:
    needs: graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Rebuild the knowledge-graph export
        run: make site
        working-directory: graph
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
